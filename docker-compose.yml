  #     - server-monitor
  #   networks:
  #     - monitor-network

  # Optional: Database service for storing historical data
  # database:
  #   image: postgres:15-alpine
  #   container_name: server-monitor-db
  #   restart: unless-stopped
  #   environment:
  #     - POSTGRES_DB=monitor
  #     - POSTGRES_USER=monitor
  #     - POSTGRES_PASSWORD=monitor_password
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #     - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
  #   networks:
  #     - monitor-network
  #   ports:
  #     - "5432:5432"

  # Optional: Redis service for caching and real-time data
  # redis:
  #   image: redis:7-alpine
  #   container_name: server-monitor-redis
  #   restart: unless-stopped
  #   command: redis-server --appendonly yes
  #   volumes:
  #     - redis_data:/data
  #   networks:
  #     - monitor-network
  #   ports:
  #     - "6379:6379"

# Network definition
networks:
  monitor-network:
    driver: bridge
    name: server-monitor-network

