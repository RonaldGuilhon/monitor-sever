# Server Monitor - Docker Compose Configuration
# This file defines the services for running Server Monitor in containers

version: '3.8'

services:
  # Main Server Monitor service
  server-monitor:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: server-monitor
    restart: unless-stopped
    
    # Environment variables
    environment:
      - MONITOR_LOG_LEVEL=INFO
      - MONITOR_PING_TIMEOUT=5
      - MONITOR_HTTP_TIMEOUT=10
      - MONITOR_CHECK_INTERVAL=60
      - MONITOR_ENABLE_SOUND_ALERTS=false
      - MONITOR_ENABLE_EMAIL_ALERTS=false
    
    # Volume mounts for persistent data
    volumes:
      - ./config:/app/config:rw
      - ./data:/app/data:rw
      - ./logs:/app/logs:rw
      - /etc/localtime:/etc/localtime:ro
    
    # Network configuration
    networks:
      - monitor-network
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    
    # Health check
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.path.insert(0, '/app/src'); from monitor_server.core.monitor import ServerMonitor; print('OK')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Optional: Web dashboard service (for future implementation)
  # web-dashboard:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile.web
  #   container_name: server-monitor-web
  #   restart: unless-stopped
  #   ports:
  #     - "8080:8080"
  #   environment:
  #     - MONITOR_API_URL=http://server-monitor:8081
