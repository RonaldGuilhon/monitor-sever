version: '3.8'

services:
  monitor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: server-monitor
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./servers_config.json:/home/monitor/servers_config.json
      - ./config:/home/monitor/config
      - monitor-logs:/home/monitor/logs
      - monitor-data:/home/monitor/data
    environment:
      - MONITOR_INTERVAL=30
      - ALERTS_SOUND_ENABLED=false
      - LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Optional: Prometheus metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    profiles:
      - monitoring

volumes:
  monitor-logs:
  monitor-data:
